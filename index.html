<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NC PICKS_MDP 모니터링</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#ece6db; --card:#ffffff; --line:#e4ddd0; --line2:#f0ebe2;
    --tx:#221e18; --tx2:#6a6256; --tx3:#a89f90;
    --ac:#a87f3e; --acbg:#f5eddd;
    --red:#bf4338; --redbg:#f8ebe8; --amber:#c4881f; --amberbg:#faf1df;
    --blue:#3f6f9c; --bluebg:#edf1f6; --green:#4e8a5f; --greenbg:#eaf3ec; --slate:#7a7263; --slatebg:#f2efe9;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;background:linear-gradient(160deg,#efeae1 0%,#ece6db 45%,#e6dfd1 100%);background-attachment:fixed;color:var(--tx);font-size:13px;-webkit-font-smoothing:antialiased;}
  .num{font-variant-numeric:tabular-nums;}
  .material-icons-outlined{font-size:18px;line-height:1;vertical-align:middle;}
  .app{display:flex;min-height:100vh;}
  /* sidebar light */
  .side{width:202px;flex-shrink:0;background:#2a2620;padding:14px 10px;display:flex;flex-direction:column;gap:1px;}
  .logo{display:flex;align-items:center;gap:9px;padding:6px 9px 16px;font-size:15px;font-weight:700;letter-spacing:-.01em;color:#f2ead9;}
  .logo .m{width:26px;height:26px;border-radius:7px;background:var(--ac);color:#2a2620;display:flex;align-items:center;justify-content:center;}
  .nav{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;color:#b4ab9b;cursor:pointer;font-weight:500;}
  .nav .material-icons-outlined{font-size:18px;color:#88806f;}
  .nav:hover{background:#363129;color:#fff;}
  .nav:hover .material-icons-outlined{color:#cdb98f;}
  .nav.on{background:rgba(168,127,62,.16);color:#e7c98a;}
  .nav.on .material-icons-outlined{color:#e7c98a;}
  .grp{font-size:10.5px;color:#7c7363;padding:14px 10px 5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;}
  /* main */
  .main{flex:1;min-width:0;padding:16px 20px 36px;}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .top h1{font-size:17px;font-weight:700;letter-spacing:-.02em;}
  .top .sub{font-size:11.5px;color:var(--tx2);margin-top:2px;}
  .ctrl{display:flex;gap:7px;align-items:center;}
  select.sel,.btn{font-family:inherit;font-size:12.5px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 11px;color:var(--tx);cursor:pointer;outline:none;}
  select.sel:hover,.btn:hover{border-color:#d9dce1;}
  .btn .material-icons-outlined{font-size:16px;}
  .inp{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;outline:none;width:160px;}
  .inp:focus{border-color:var(--ac);}
  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  .kpis2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
  .tabs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px;box-shadow:0 1px 2px rgba(74,60,36,.05);}
  .tab{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:12.5px;font-weight:600;border:none;background:transparent;color:var(--tx2);border-radius:7px;padding:7px 15px;cursor:pointer;}
  .tab .material-icons-outlined{font-size:16px;}
  .tab.on{background:var(--ac);color:#fff;}
  .tab:hover:not(.on){background:var(--acbg);}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(74,60,36,.04),0 6px 16px rgba(74,60,36,.05);}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kc,transparent);}
  .kpi .h{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .kpi .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .kpi .ic .material-icons-outlined{font-size:19px;}
  .kpi .lab{font-size:12px;color:var(--tx2);font-weight:600;}
  .kpi .val{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1;}
  .kpi .val .u{font-size:13px;font-weight:600;color:var(--tx3);margin-left:2px;}
  .kpi .sub{font-size:11px;color:var(--tx3);margin-top:6px;font-weight:500;}
  /* cards */
  .grid2{display:grid;grid-template-columns:1.7fr 1fr;gap:12px;margin-bottom:12px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(74,60,36,.04),0 8px 22px rgba(74,60,36,.05);}
  .ch{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line2);}
  .ch h2{font-size:13.5px;font-weight:700;letter-spacing:-.01em;}
  .ch .a{font-size:11.5px;color:var(--ac);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
  .ch .lg{font-size:10.5px;color:var(--tx3);display:flex;gap:8px;align-items:center;}
  .ch .lg b{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:3px;vertical-align:-1px;}
  .cb{padding:6px 16px;}
  /* delay rows */
  .drow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line2);cursor:pointer;}
  .drow:first-child{border-top:none;}
  .drow:hover{background:#f6efe1;}
  .drow .av{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .drow .av .material-icons-outlined{font-size:16px;}
  .drow .nm{font-weight:600;font-size:13px;}
  .drow .mt{font-size:11px;color:var(--tx2);margin-top:2px;}
  .drow .rt{text-align:right;}
  .bdg{display:inline-block;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 8px;}
  .drow .fc{font-size:10.5px;color:var(--tx3);margin-top:4px;}
  /* legend */
  .lgr{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;}
  .lgr .sw{width:9px;height:9px;border-radius:2px;}
  .lgr .v{margin-left:auto;font-weight:700;}
  /* pipeline */
  .filt{display:flex;gap:7px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap;}
  .tlwrap{overflow:auto;max-height:62vh;}
  table.tl{border-collapse:separate;border-spacing:0;width:100%;font-size:11px;}
  table.tl th{font-weight:600;color:var(--tx3);padding:7px 1px;text-align:center;font-size:9.5px;white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2;}
  table.tl td{padding:3px 1px;}
  table.tl tbody tr{cursor:pointer;border-top:1px solid var(--line2);}
  table.tl tbody tr:hover td{background:#f6efe1;}
  .cell{width:15px;height:12px;border-radius:2px;margin:0 auto;}
  table.tl .c1{position:sticky;left:0;background:var(--card);z-index:3;min-width:50px;max-width:50px;}
  table.tl .c2{position:sticky;left:50px;background:var(--card);z-index:3;min-width:118px;max-width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--line);}
  table.tl thead .c1,table.tl thead .c2{z-index:4;}
  table.tl tbody tr:hover .c1,table.tl tbody tr:hover .c2{background:#f6efe1;}
  .brand{font-weight:600;font-size:12.5px;}
  .bmeta{font-size:10.5px;color:var(--tx3);margin-top:1px;}
  /* generic table */
  table.gt{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.gt th{text-align:left;font-weight:600;color:var(--tx3);font-size:11px;padding:9px 14px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:var(--card);z-index:1;}
  table.gt td{padding:9px 14px;border-top:1px solid var(--line2);}
  table.gt tbody tr:hover{background:#f6efe1;}
  .ta-r{text-align:right;}
  table.gt th.c,table.gt td.c{text-align:center;width:112px;border-left:1px solid var(--line2);}
  #agg-amt table.gt{font-size:11.5px;}
  #agg-amt table.gt td{padding:7px 12px;font-size:11.5px;}
  #agg-amt table.gt th{font-size:10.5px;}
  /* DB관리 편집 그리드 */
  .dbwrap{overflow:auto;max-height:70vh;}
  table.db{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap;}
  table.db th{position:sticky;top:0;background:var(--card);color:var(--tx3);font-size:9.5px;font-weight:600;padding:7px 4px;border-bottom:1px solid var(--line);z-index:2;text-align:center;}
  table.db td{padding:2px 3px;border-top:1px solid var(--line2);text-align:center;}
  table.db .k1{position:sticky;left:0;background:var(--card);z-index:1;text-align:left;padding-left:8px;min-width:52px;}
  table.db .k2{position:sticky;left:52px;background:var(--card);z-index:1;text-align:left;min-width:118px;max-width:118px;overflow:hidden;text-overflow:ellipsis;border-right:1px solid var(--line);}
  table.db thead .k1,table.db thead .k2{z-index:3;}
  table.db input{width:48px;border:1px solid transparent;background:transparent;font:inherit;text-align:center;border-radius:4px;padding:2px 1px;color:var(--tx);}
  table.db input:hover{border-color:var(--line);}
  table.db input:focus{border-color:var(--ac);background:#fff;outline:none;}
  table.db input.err{background:var(--redbg);border-color:var(--red);color:var(--red);font-weight:700;}
  table.db input.ov{background:#eef6ff;border-color:#9cc0e6;font-weight:700;}
  table.db td.ref{text-align:left;color:var(--tx2);white-space:nowrap;padding:3px 8px;font-size:10.5px;background:#faf8f4;max-width:130px;overflow:hidden;text-overflow:ellipsis;}
  table.db tbody tr:hover td{background:#f6efe1;}
  table.db tbody tr:hover .k1,table.db tbody tr:hover .k2{background:#f6efe1;}
  .dbbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line2);}
  .errbtn{background:var(--redbg);color:var(--red);border:1px solid var(--red);border-radius:8px;padding:7px 13px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .savebtn{background:var(--ac);color:#fff;border:1px solid var(--ac);border-radius:8px;padding:7px 15px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .errlist{max-height:58vh;overflow:auto;padding:0 4px;}
  .erow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--line2);cursor:pointer;}
  .erow:hover{background:#f6efe1;}
  /* 운송수단 × 구간 매트릭스 */
  table.mtx{border-collapse:separate;border-spacing:0;font-size:11px;white-space:nowrap;}
  table.mtx th,table.mtx td{padding:8px 9px;text-align:center;border-top:1px solid var(--line2);}
  table.mtx thead th{position:sticky;top:0;background:var(--card);color:var(--tx3);font-size:9.5px;font-weight:600;border-bottom:1px solid var(--line);border-top:none;z-index:2;}
  table.mtx .rl{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;min-width:96px;z-index:1;border-right:1px solid var(--line);}
  table.mtx thead .rl{z-index:3;}
  table.mtx .tot{border-right:2px solid var(--line);background:#faf7f1;}
  table.mtx tbody tr:hover td{background:#f6efe1;}
  table.mtx tbody tr:hover .rl{background:#f6efe1;}
  /* 오더 전체 – 전 구간 일자 */
  .otwrap{overflow:auto;max-height:76vh;}
  table.ot{border-collapse:separate;border-spacing:0;width:100%;font-size:11px;white-space:nowrap;}
  table.ot th{font-weight:600;color:var(--tx3);padding:8px 6px;text-align:center;font-size:10px;white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:2;border-bottom:1px solid var(--line);}
  table.ot td{padding:6px 6px;border-top:1px solid var(--line2);}
  table.ot tbody tr{cursor:pointer;}
  table.ot tbody tr:hover td{background:#f6efe1;}
  table.ot .o1{position:sticky;left:0;background:var(--card);z-index:3;min-width:52px;max-width:52px;text-align:left;padding-left:10px;}
  table.ot .o2{position:sticky;left:52px;background:var(--card);z-index:3;min-width:130px;max-width:130px;overflow:hidden;text-overflow:ellipsis;text-align:left;border-right:1px solid var(--line);}
  table.ot thead .o1,table.ot thead .o2{z-index:4;}
  table.ot tbody tr:hover .o1,table.ot tbody tr:hover .o2{background:#f6efe1;}
  table.ct{width:100%;border-collapse:collapse;font-size:12px;}
  table.ct th{text-align:left;font-weight:600;color:var(--tx3);font-size:10.5px;padding:8px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;position:sticky;top:0;background:var(--card);z-index:1;}
  table.ct td{padding:8px 8px;border-top:1px solid var(--line2);white-space:nowrap;}
  table.ct tbody tr{cursor:pointer;}
  table.ct tbody tr:hover td{background:#f6efe1;}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(16,22,38,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:24px;}
  .ov.on{display:flex;}
  .sheet{background:var(--card);border-radius:14px;width:560px;max-width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(16,22,38,.22);}
  .mhd{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line2);}
  .mhd .x{cursor:pointer;color:var(--tx3);}
  .mg{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:14px 18px;}
  .mg .k{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.03em;}
  .mg .vv{font-weight:600;font-size:13px;margin-top:1px;}
  .stg{display:grid;grid-template-columns:14px 1fr auto auto;gap:10px;align-items:center;padding:7px 18px;border-top:1px solid var(--line2);font-size:12.5px;}
  .stg .dot{width:10px;height:10px;border-radius:50%;}
  .stg .tg{color:var(--tx3);font-size:11px;text-align:right;min-width:52px;}
  .seclab{font-size:10.5px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;font-weight:600;padding:12px 18px 2px;}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="m"><span class="material-icons-outlined">inventory_2</span></span> MDP 모니터링</div>
    <div class="nav on" data-v="dash"><span class="material-icons-outlined">dashboard</span> 대시보드</div>
    <div class="nav" data-v="orders"><span class="material-icons-outlined">format_list_bulleted</span> 오더 전체</div>
    <div class="nav" data-v="pipe"><span class="material-icons-outlined">timeline</span> 파이프라인</div>
    <div class="nav" data-v="pending"><span class="material-icons-outlined">pending_actions</span> 미입고 현황</div>
    <div class="nav" data-v="agg"><span class="material-icons-outlined">donut_large</span> 통계</div>
    <div class="grp">관리</div>
    <div class="nav" data-v="recon"><span class="material-icons-outlined">compare_arrows</span> SAP 대사</div>
    <div class="nav" data-v="db"><span class="material-icons-outlined">storage</span> DB관리</div>
    <div class="nav" data-v="set"><span class="material-icons-outlined">settings</span> 설정</div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1>NC PICKS_MDP 모니터링</h1><div class="sub" id="asof">로딩 중…</div></div>
      <div class="ctrl">
        <select class="sel" id="fmd"><option value="all">전체 담당자</option></select>
        <select class="sel" id="fsea"><option value="all">전체 시즌</option></select>
        <select class="sel" id="fmonth"><option value="all">전체 12P</option></select>
        <button class="btn" id="fxls" onclick="exportExcel()" title="현재 필터 오더를 엑셀로 저장"><span class="material-icons-outlined">download</span> 엑셀</button>
        <button class="btn" onclick="location.reload()"><span class="material-icons-outlined">refresh</span></button>
      </div>
    </div>

    <div id="view-dash">
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="card">
          <div class="ch"><h2>CHECK LIST</h2><span class="lg"><span class="material-icons-outlined" style="font-size:14px;">touch_app</span> 행 클릭 = 상세</span></div>
          <div id="delays" style="max-height:392px;overflow:auto;"></div>
        </div>
        <div>
          <div class="card">
            <div class="ch"><h2>진행상황별 금액</h2></div>
            <div class="cb" style="padding:14px 16px;"><div style="position:relative;height:140px;"><canvas id="donut"></canvas></div><div id="leg" style="margin-top:10px;"></div></div>
          </div>
          <div class="kpis2" id="kpis2"></div>
        </div>
      </div>
      <div class="card">
        <div class="ch"><h2>오더 파이프라인</h2>
          <span class="lg"><span><b style="background:#5a8a5f;"></b>완료</span><span><b style="background:#3f6f9c;"></b>현재</span><span><b style="background:#bf4338;"></b>지연</span><span><b style="background:#c4881f;"></b>임박</span><span><b style="background:#e8e2d7;"></b>예정</span><span><b style="background:#2a2620;"></b>해당없음</span><span style="margin-left:8px;color:var(--ac);font-weight:600;">· 행 클릭 = 상세</span></span>
        </div>
        <div class="filt">
          <select class="sel" id="fstage"><option value="all">단계 전체</option></select>
          <select class="sel" id="fsort"><option value="month">계절월순</option><option value="name">담당자순</option><option value="delay">지연일순</option><option value="amt">금액순</option><option value="prog">진행순</option></select>
          <input class="inp" id="fsearch" placeholder="브랜드 검색">
          <span style="font-size:11.5px;color:var(--tx3);margin-left:auto;" id="cnt"></span>
        </div>
        <div class="tlwrap"><table class="tl"><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
      </div>
    </div>
    <div id="view-orders" style="display:none;"></div>
    <div id="view-pipe" style="display:none;"></div>
    <div id="view-agg" style="display:none;"></div>
    <div id="view-pending" style="display:none;"></div>
    <div id="view-recon" style="display:none;"></div>
    <div id="view-db" style="display:none;"></div>
    <div id="view-set" style="display:none;"></div>
  </main>

/* ===== DB관리: 전체 편집 + 오류 팝업 + 교정값 보존(빈칸만 갱신) ===== */
var RAWISO={};            // 행번호 → 원본(import) actiso  (재import시 이거로 갱신)
function ovGet(){try{return JSON.parse(localStorage.getItem("mdp_db_ov")||"{}");}catch(e){return{};}}
function ovSet(o){localStorage.setItem("mdp_db_ov",JSON.stringify(o));}
function recompLT(o){   // actiso(전체날짜)로 구간·총 리드타임 재계산
  var D=o.actiso.map(function(s){return s?new Date(s+"T00:00:00"):null;});
  function df(a,b){return (a&&b)?Math.round((a-b)/86400000):null;}
  o.lt=[null];for(var i=1;i<18;i++)o.lt.push(df(D[i],D[i-1]));
  o.ltin=df(D[13],D[0]); o.ltmid=df(D[16],D[13]); o.ltout=df(D[17],D[0]);
  o.act=o.actiso.map(function(s){return s?s.slice(5):"";});
}
function applyOverrides(){   // 부팅/저장 후: 원본 위에 교정값 덮고 재계산
  OKMAP=okGet();
  var ov=ovGet();
  ALL.forEach(function(o){
    if(!RAWISO[o.row])RAWISO[o.row]=o.actiso.slice();      // 원본 백업(최초 1회)
    o.actiso=RAWISO[o.row].slice();                        // 원본으로 리셋
    var c=ov[o.row]; if(c){for(var k in c)o.actiso[+k]=c[k];}  // 교정값 덮기
    recompLT(o);
  });
}
var ERRTH=-3;   // 3일 이상 역전만 오류로(=하루이틀 배치 노이즈 제외)
var ERRSKIP={9:1,16:1};   // 결제→픽업(선픽업후결제)·등록→상품화(상품화 먼저)=순서 유동적, 오류 아님
var OKMAP={};   // 사용자가 "오류 아님"으로 확인한 건 (키: row-단계idx)
function okGet(){try{return JSON.parse(localStorage.getItem("mdp_db_ok")||"{}");}catch(e){return{};}}
function okSet(m){localStorage.setItem("mdp_db_ok",JSON.stringify(m));}
function isErr(o,i){return i>=1 && !ERRSKIP[i] && !OKMAP[o.row+"-"+i] && o.lt[i]!=null && o.lt[i]<=ERRTH;}
function dbErrors(){   // 날짜 역전(음수 구간) = 확인 필요
  var e=[];
  ALL.forEach(function(o){for(var i=1;i<18;i++){if(isErr(o,i))e.push({o:o,i:i,d:o.lt[i]});}});
  return e.sort(function(a,b){return a.d-b.d;});
}
function dbErrOK(row,i){OKMAP[row+"-"+i]=1;okSet(OKMAP);recompute();renderDB();dbErrPopup();}
function dbErrReset(){if(confirm("'오류 아님' 확인을 모두 해제할까요? (다시 오류로 뜹니다)")){OKMAP={};okSet(OKMAP);recompute();renderDB();dbErrPopup();}}
function renderDB(){
  var errs=dbErrors();

  var REF=[
    ["계절연도",function(o){return o.year||"";}],

  ];
  var head="<th class='k1'>담당자</th><th class='k2'>브랜드</th>"+REF.map(function(r){return "<th>"+r[0]+"</th>";}).join("")+STAGES.map(function(s){return "<th>"+s+"</th>";}).join("")+"<th>구분</th>";
  var list=ALL.slice().sort(function(a,b){return (a.md||"힣").localeCompare(b.md||"힣","ko")||(a.br||"").localeCompare(b.br||"","ko");});
  var body=list.map(function(o){
    var refCells=REF.map(function(r){var v=r[1](o);return "<td class='ref' title='"+esc(v)+"'>"+esc(v)+"</td>";}).join("");
    var cells=STAGES.map(function(s,j){
      if(o.st[j]==="skip"&&j>=8&&j<=12&&o.ship==="IN-LAND")
        return "<td style='background:#c9c1b2;' title='해당없음(국내=무역 구간 없음)'></td>";
      var neg=isErr(o,j);
      var iso=o.actiso[j]||"";
      return "<td><input data-row='"+o.row+"' data-i='"+j+"' value='"+(iso?iso.slice(5):"")+"' title='"+(iso||"")+"' class='"+(neg?"err":"")+"' placeholder='·'></td>";
    }).join("");
    return "<tr data-row='"+o.row+"'><td class='k1'>"+(o.md||"")+"</td><td class='k2' title='"+esc(o.br)+"'>"+o.br+"</td>"+refCells+cells+"<td class='ref'>"+esc(o.gubun)+"</td></tr>";
  }).join("");
  document.getElementById("view-db").innerHTML=
    "<div class='card'><div class='dbbar'>"+

    "<button class='savebtn' onclick='dbSave()'>💾 저장 (대시보드 반영)</button>"+
    "<span style='font-size:11.5px;color:var(--tx2);'>회색=읽기전용(원본판 값) · 날짜칸만 편집 · 빨강=역전오류 · 파랑=내가 고친 값 · 신규오더는 원본 판에서 추가</span></div>"+
    "<div class='dbwrap'><table class='db'><thead><tr>"+head+"</tr></thead><tbody>"+body+"</tbody></table></div></div>";
  // 내가 고친 셀 파랑 표시
  var ov=ovGet();
  document.querySelectorAll("#view-db input").forEach(function(inp){
    var c=ov[inp.dataset.row]; if(c&&c[inp.dataset.i]!=null)inp.classList.add("ov");
  });

function dbSave(){
  var ov=ovGet(); var yr={};
  // 각 오더의 임의 연도추정용: 같은 오더 내 다른 단계의 연도 참고
  document.querySelectorAll("#view-db tbody tr").forEach(function(tr){
    var row=tr.dataset.row;
    tr.querySelectorAll("input").forEach(function(inp){
      var i=inp.dataset.i, v=inp.value.trim();
      var raw=(RAWISO[row]&&RAWISO[row][i])||"";
      if(!v){ // 비움
        if(raw){ if(!ov[row])ov[row]={}; ov[row][i]=""; } else if(ov[row]){ delete ov[row][i]; }
        return;
      }
      // MM-DD 입력 → 연도 보정: 원본 연도 있으면 그거, 없으면 같은행 인접단계 연도
      var iso=toISO(v,row,i);
      if(iso!==raw){ if(!ov[row])ov[row]={}; ov[row][i]=iso; }
      else if(ov[row]){ delete ov[row][i]; }
    });
    if(ov[row]&&Object.keys(ov[row]).length===0)delete ov[row];
  });
  ovSet(ov);
  applyOverrides(); recompute(); renderDB();
  alert("저장됐어요. 대시보드에 반영됐고, 다음 자동수집 때도 이 값은 유지돼요. ✓");
}
function toISO(v,row,i){   // "3-25"/"03-25"/"2026-03-25" → ISO. 연도 없으면 추정
  v=v.replace(/[.\/]/g,"-").trim();
  var p=v.split("-").map(function(x){return x.trim();});
  if(p.length===3)return p[0].padStart(4,"20")+"-"+p[1].padStart(2,"0")+"-"+p[2].padStart(2,"0");
  var mm=p[0].padStart(2,"0"),dd=(p[1]||"1").padStart(2,"0");
  // 연도: 원본 같은칸 → 인접칸 → 현재연도
  var yr=null, raw=RAWISO[row]||[];
  if(raw[i])yr=raw[i].slice(0,4);
  if(!yr){for(var j=17;j>=0;j--){if(raw[j]){yr=raw[j].slice(0,4);break;}}}
  if(!yr)yr="2026";
  return yr+"-"+mm+"-"+dd;
}

      "<div style='overflow:auto;'><table class='mtx'><thead><tr>"+mtxHead+"</tr></thead><tbody>"+body+"</tbody></table></div></div>";}
  var shipMtx=ltMatrix("운송수단 × 구간 리드타임","ship",["OCEAN","AIR","IN-LAND"])
    +ltMatrix("카테고리 × 구간 리드타임","cat",grpVals("cat",["남성","여성","아동","잡화"]))
    +ltMatrix("시즌 × 구간 리드타임","sea",grpVals("sea",null));
  var chips=[
    ["오퍼→입고 실적","local_shipping","var(--blue)","var(--bluebg)",d1(ai),"일","목표 "+tgtIn+"일"],
    ["오퍼→출고 실적","done_all","var(--ac)","var(--acbg)",d1(ao),"일","총 리드타임 · 목표 "+tgtOut+"일"],
    ["목표대비","speed",(ao!=null&&ao>tgtOut?"var(--red)":"var(--blue)"),(ao!=null&&ao>tgtOut?"var(--redbg)":"var(--bluebg)"),(ao==null?"—":((ao-tgtOut>0?"+":"")+d1(ao-tgtOut))),"일",(ao!=null&&ao>tgtOut?"지연":"단축")],
    ["최다 지연 구간","trending_up","var(--red)","var(--redbg)",(maxCnt<0?"—":maxCnt),"건",maxSeg||"—"]];
  var chipHtml=chips.map(function(k){return "<div class='kpi' style='--kc:"+k[2]+"'><div class='h'><span class='ic' style='background:"+k[3]+";color:"+k[2]+";'><span class='material-icons-outlined'>"+k[1]+"</span></span><span class='lab'>"+k[0]+"</span></div><div class='val num' style='color:"+k[2]+";'>"+k[4]+"<span class='u'>"+k[5]+"</span></div><div class='sub'>"+k[6]+"</div></div>";}).join("");
  var ltHtml=
    "<div class='kpis' style='grid-template-columns:repeat(4,1fr);'>"+chipHtml+"</div>"+
    "<div class='card' style='margin-bottom:12px;'><div class='ch'><h2>구간별 리드타임 (목표 vs 실적)</h2><span class='lg'>회색=목표 · 색막대=실적(빨강 늦음/파랑 빠름)</span></div><div style='padding:14px 16px;'><div style='position:relative;height:300px;'><canvas id='ltbar'></canvas></div></div></div>"+
    shipMtx;
  // ── 금액 탭 ──
  var phN=["품의 전","입고 전","출고 전","완료"],phC=["#cbd0da","#f2a9c9","#f6c58f","#a3d9c4"],phS=[0,0,0,0];
  f.forEach(function(o){phS[phase(o)]+=o.amtv;});
  var phChips=phN.map(function(n,i){return "<div class='kpi'><div class='h'><span class='ic' style='background:"+phC[i]+"33;color:"+phC[i]+";'><span class='material-icons-outlined'>donut_large</span></span><span class='lab'>"+n+"</span></div><div class='val num'>"+won(phS[i])+"<span class='u'>억</span></div></div>";}).join("");
  var stepRows=amtAggBy(f,"step").sort(function(a,b){var ia=STAGES.indexOf(a.k),ib=STAGES.indexOf(b.k);return (ia<0?99:ia)-(ib<0?99:ib);});
  var amtHtml=
    "<div class='kpis' style='grid-template-columns:repeat(4,1fr);'>"+phChips+"</div>"+
    "<div class='card' style='margin-bottom:12px;'><div class='ch'><h2>계절월별 발주액 · 입고액</h2><span class='lg'>가로=12P(계절월) · 세로=금액(억)</span></div><div style='padding:14px 16px;'><div style='position:relative;height:300px;'><canvas id='amtbar'></canvas></div></div></div>"+
    amtAggTable("구간별 (현재 단계 기준)",stepRows,"현재단계")+
    amtAggTable("지역별",amtAggBy(f,"region"))+
    amtAggTable("카테고리별",amtAggBy(f,"cat"))+
    amtAggTable("시즌별",amtAggBy(f,"sea"));
  document.getElementById("view-agg").innerHTML=
    "<div class='tabs'><button class='tab' data-t='lt'><span class='material-icons-outlined'>schedule</span> 리드타임</button>"+
    "<button class='tab' data-t='amt'><span class='material-icons-outlined'>payments</span> 금액</button></div>"+
    "<div id='agg-lt'>"+ltHtml+"</div><div id='agg-amt'>"+amtHtml+"</div>";
  document.querySelectorAll("#view-agg .tab").forEach(function(b){b.onclick=function(){setAggTab(b.dataset.t);};});
  setAggTab(AGGTAB);
  // 구간별 리드타임 막대 그래프
  if(window.Chart&&document.getElementById("ltbar")){
    var barLab=SEGI.map(function(i){return STAGES[i-1]+"→"+STAGES[i];});
    var barTgt=SEGI.map(function(i){return LT[i]||0;});
    var barAct=SEGI.map(function(i){var v=segStat(f,i).av;return v==null?null:Math.round(v*10)/10;});
    var barCol=SEGI.map(function(i){var v=segStat(f,i).av;return (v!=null&&v>(LT[i]||0))?"#bf4338":"#3f6f9c";});
    if(ltChart)ltChart.destroy();
    ltChart=new Chart(document.getElementById("ltbar"),{type:"bar",
      data:{labels:barLab,datasets:[
        {label:"목표",data:barTgt,backgroundColor:"#8a8272",borderRadius:3},
        {label:"실적",data:barAct,backgroundColor:barCol,borderRadius:3}]},
      options:{maintainAspectRatio:false,
        plugins:{legend:{display:true,position:"top",labels:{boxWidth:12,font:{size:11}}}},
        scales:{y:{title:{display:true,text:"일"},grid:{color:"#f0ebe2"}},x:{ticks:{font:{size:9},maxRotation:90,minRotation:55,autoSkip:false}}}}});
  }
  // 계절월(12P)별 발주액·입고액 막대 그래프 (금액 탭)
  if(window.Chart&&document.getElementById("amtbar")){
    var mm={};f.forEach(function(o){var m=o.month||"미지정";if(!mm[m])mm[m]={amt:0,inv:0};mm[m].amt+=o.amtv;mm[m].inv+=(o.inamtv||0);});
    var mk=Object.keys(mm).sort(function(a,b){return monK(a)-monK(b);});
    var mOrd=mk.map(function(m){return Math.round(mm[m].amt/1e8*10)/10;});
    var mInv=mk.map(function(m){return Math.round(mm[m].inv/1e8*10)/10;});
    if(amtChart)amtChart.destroy();
    amtChart=new Chart(document.getElementById("amtbar"),{type:"bar",
      data:{labels:mk,datasets:[
        {label:"발주액",data:mOrd,backgroundColor:"#a87f3e",borderRadius:3},
        {label:"입고액",data:mInv,backgroundColor:"#3f6f9c",borderRadius:3}]},
      options:{maintainAspectRatio:false,
        plugins:{legend:{display:true,position:"top",labels:{boxWidth:12,font:{size:11}}},
          tooltip:{callbacks:{label:function(c){return c.dataset.label+" "+c.parsed.y+"억";}}}},
        scales:{y:{title:{display:true,text:"억"},grid:{color:"#f0ebe2"}},x:{title:{display:true,text:"12P(계절월)"},ticks:{font:{size:10}}}}}});
  }
}
function renderPending(){
  var list=UNRECV.filter(curFilter);   // 상단 필터(담당자/시즌/12P) 적용
  var rows=list.map(function(o){var t=TINT[o.lv]||TINT.plan;
    return "<tr><td class='brand'>"+o.br+"</td><td>"+o.sea+"</td><td style='text-align:center;'>"+(o.month||"-")+"</td><td>"+o.md+"</td><td>"+(o.vendor||"")+"</td><td class='ta-r num'>"+o.amt+"</td><td>"+o.step+"</td><td><span class='bdg num' style='background:"+t[1]+";color:"+t[0]+";'>"+o.delay+"</span></td></tr>";}).join("");
  document.getElementById("view-pending").innerHTML="<div class='card'><div class='ch'><h2>미입고 현황</h2><span class='lg'>발주됐으나 입고 전 "+list.length+"건</span></div>"+
    "<table class='gt'><thead><tr><th>브랜드</th><th>시즌</th><th>계절월</th><th>담당자</th><th>구매처</th><th class='ta-r'>발주(백만)</th><th>현재단계</th><th>상태</th></tr></thead><tbody>"+rows+"</tbody></table></div>";
}
function renderRecon(){
  var pre=RECON.mdp_pre.map(function(o){return "<tr><td class='brand'>"+o.br+"</td><td>"+o.vendor+"</td><td>"+o.md+"</td><td>"+o.sea+"</td><td class='ta-r num'>"+o.amt+"</td></tr>";}).join("");
  var so=RECON.sap_only.length;
  document.getElementById("view-recon").innerHTML=
    "<div class='kpis' style='grid-template-columns:1fr 1fr;'><div class='kpi'><div class='lab'>SAP엔 있는데 MDP 누락 (전산 등록됐는데 빠짐)</div><div class='val num' style='color:"+(so?"var(--red)":"var(--green)")+";margin-top:8px;'>"+so+"<span class='u'>건</span></div></div>"+
    "<div class='kpi'><div class='lab'>MDP엔 있는데 SAP 없음 (전산 등록 前 = 정상)</div><div class='val num' style='margin-top:8px;'>"+RECON.mdp_pre.length+"<span class='u'>건</span></div></div></div>"+
    "<div class='card' style='margin-top:12px;'><div class='ch'><h2>전산 등록 前 오더 (MDP만 있음)</h2></div>"+
    "<table class='gt'><thead><tr><th>브랜드</th><th>구매처</th><th>담당자</th><th>시즌</th><th class='ta-r'>발주(백만)</th></tr></thead><tbody>"+pre+"</tbody></table></div>";
}

function exportExcel(){
  if(!window.XLSX){alert("엑셀 라이브러리 로딩 중이에요. 인터넷 연결 확인 후 잠시 뒤 다시 눌러주세요.");return;}
  var f=ALL.filter(curFilter);
  if(!f.length){alert("내보낼 오더가 없어요.");return;}
  var SL={done:"완료",late:"지연",soon:"임박",cur:"진행중",plan:"대기",skip:"건너뜀",info:"정보미입력"};
  // 정렬: 담당자-브랜드-시즌-계절월
  f=f.slice().sort(function(a,b){return (a.md||"힣").localeCompare(b.md||"힣","ko")||(a.br||"").localeCompare(b.br||"","ko")||(a.sea||"").localeCompare(b.sea||"","ko")||(monK(a.month)-monK(b.month));});
  var head=["담당자","브랜드","시즌","계절월","카테고리","구매처","발주금액(백만)","입고금액(백만)","현재단계","상태","목표대비","최종전망","목표입고일","목표출고일","진행단계"].concat(STAGES);
  var aoa=[head];
  f.forEach(function(o){
    var row=[o.md||"",o.br||"",o.sea||"",o.month||"",o.cat||"",o.vendor||"",o.amt,Math.round((o.inamtv||0)/1e6),
      (o.lv==="done"?"출고완료":o.step),SL[o.lv]||o.lv,o.delay||"",o.fc||"",o.tgtin||"",o.tgtout||"",o.prog];
    for(var i=0;i<STAGES.length;i++){
      var d=(o.act&&o.act[i])||"", stt=o.st[i];
      if(stt==="skip")row.push("건너뜀");
      else if(d)row.push(d);
      else row.push((stt==="late")?"지연":(stt==="soon")?"임박":(stt==="cur")?"진행":"");
    }
    aoa.push(row);
  });
  var ws=XLSX.utils.aoa_to_sheet(aoa);
  // 컬럼 폭
  var w=[7,18,7,6,7,14,12,12,9,7,9,12,10,10,7]; for(var k=0;k<STAGES.length;k++)w.push(7);
  ws["!cols"]=w.map(function(x){return {wch:x};});
  ws["!freeze"]={xSplit:2,ySplit:1};
  var wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"오더현황");
  var md=document.getElementById("fmd").value, tag=(md&&md!=="all")?("_"+md):"";
  XLSX.writeFile(wb,"NC PICKS_MDP_"+(window.__ASOF||"")+tag+".xlsx");
}
function renderSecondary(f){
  if(CURV==="orders")renderOrders(f);
  else if(CURV==="pipe")renderPipe(f);
  else if(CURV==="agg")renderAggView(f);
  else if(CURV==="pending")renderPending();
}
function recompute(){var f=ALL.filter(curFilter);renderKPIs(f);renderAgg(f);renderDelays(f);renderTimeline(f);renderSecondary(f);}
document.querySelectorAll(".nav").forEach(function(n){n.onclick=function(){var v=n.dataset.v;
  document.querySelectorAll(".nav").forEach(function(x){x.classList.remove("on");});n.classList.add("on");
  if(["dash","orders","pipe","agg","pending","recon","db","set"].indexOf(v)>=0){switchView(v);renderSecondary(ALL.filter(curFilter));if(v==="set")renderSettings();if(v==="db")renderDB();}
  else{switchView("dash");alert("'"+n.textContent.trim()+"' 화면은 다음 단계에서 연결돼요 (시안)");}};});
["fmd","fsea","fmonth","fstage","fsort"].forEach(function(id){document.getElementById(id).onchange=recompute;});
document.getElementById("fsearch").oninput=function(){renderTimeline(ALL.filter(curFilter));};

function boot(d){
  STAGES=d.stages;ALL=d.orders;UNRECV=d.unreceived||[];RECON=d.recon||{sap_only:[],mdp_pre:[]};
  applyOverrides();   // 웹 교정값(localStorage) 덮어쓰고 재계산 (엑셀 원본보다 교정값 우선)
  document.getElementById("asof").textContent=d.asof+" 기준";window.__ASOF=d.asof;window.__LEADTGT=d.leadtgt||[];
  var mds=Array.from(new Set(ALL.map(function(o){return o.md;}).filter(Boolean))).sort();
  var seas=Array.from(new Set(ALL.map(function(o){return o.sea;}).filter(Boolean))).sort();
  var fmd=document.getElementById("fmd");mds.forEach(function(m){var o=document.createElement("option");o.text=m;o.value=m;fmd.appendChild(o);});
  var fsea=document.getElementById("fsea");seas.forEach(function(s){var o=document.createElement("option");o.text=s;o.value=s;fsea.appendChild(o);});
  var MO=["1","2","3","4","5","6","7","8","9","T","N","D","S","B","F","A","W"];
  var mons=Array.from(new Set(ALL.map(function(o){return o.month;}).filter(Boolean)));
  mons.sort(function(a,b){var ia=MO.indexOf(a),ib=MO.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib);});
  var fmo=document.getElementById("fmonth");mons.forEach(function(m){var o=document.createElement("option");o.text=m;o.value=m;fmo.appendChild(o);});
  var fst=document.getElementById("fstage");STAGES.forEach(function(s){var o=document.createElement("option");o.value=s;o.text=s+" 단계";fst.appendChild(o);});
  var myMd=localStorage.getItem("mdp_myMd");
  if(myMd){for(var mi=0;mi<fmd.options.length;mi++){if(fmd.options[mi].value===myMd){fmd.value=myMd;
    document.getElementById("asof").textContent=d.asof+" 기준 · "+myMd+"님 개인화";break;}}}
  renderPending();renderRecon();recompute();
}
if(window.MDP_DATA){ boot(window.MDP_DATA); }
else { fetch("mdp_data.json").then(function(r){return r.json();}).then(boot)
  .catch(function(e){document.getElementById("asof").textContent="데이터 로드 실패 — 먼저 run_MDP대시보드.bat 실행 (데이터 생성)";}); }
</script>
